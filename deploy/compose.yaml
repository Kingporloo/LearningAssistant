name: ${COMPOSE_PROJECT_NAME:-pdf-learning-infra}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/DataPort/src/main/resources/db/migration/V1__data_port.sql:/docker-entrypoint-initdb.d/01-data-port.sql:ro
      - ../backend/DataPort/src/main/resources/db/migration/V2__agent_run.sql:/docker-entrypoint-initdb.d/02-agent-run.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [database]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [database]

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [database]

  milvus:
    image: milvusdb/milvus:v2.6.20
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks: [database]

  milvus-init:
    image: curlimages/curl:8.12.1
    environment:
      MILVUS_DATABASE: ${MILVUS_DATABASE}
      MILVUS_RAG_COLLECTION: ${MILVUS_RAG_COLLECTION}
      EMBEDDING_VECTOR_DIMENSION: ${EMBEDDING_VECTOR_DIMENSION:-768}
    volumes:
      - ./init/milvus.sh:/init/milvus.sh:ro
    entrypoint: ["/bin/sh", "/init/milvus.sh"]
    depends_on:
      milvus:
        condition: service_healthy
    restart: "no"
    networks: [database]

  neo4j:
    image: neo4j:5.26.30-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "password=\"$${NEO4J_AUTH#*/}\"; cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"$$password\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [database]

  neo4j-init:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./init/neo4j.sh:/init/neo4j.sh:ro
      - ../backend/DataPort/src/main/resources/db/neo4j-schema.cypher:/init/neo4j-schema.cypher:ro
    entrypoint: ["/bin/sh", "/init/neo4j.sh"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"
    networks: [database]

volumes:
  mysql-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  neo4j-data:

networks:
  database:
    driver: bridge
